name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS-first for Phase 1. Add linux/windows when we ship those builds.
        os: [macos-latest]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cargo build (sccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sccache
          key: sccache-${{ runner.os }}

      - name: Install sccache
        run: cargo install sccache --locked || true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  frontend:
    name: Frontend (pnpm)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: svelte-kit sync
        run: pnpm --filter @framepress/desktop exec svelte-kit sync

      - name: svelte-check (typecheck)
        run: pnpm --filter @framepress/desktop exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Frontend test (vitest)
        run: pnpm --filter @framepress/desktop test -- --run
        continue-on-error: false

      - name: Prettier check
        run: pnpm format:check

  license:
    name: License + README sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check LICENSE exists
        run: test -f LICENSE
      - name: Check LICENSE-MIT exists
        run: test -f LICENSE-MIT
      - name: Check LICENSE-APACHE exists
        run: test -f LICENSE-APACHE
      - name: README has 'Phase 1' status section
        run: grep -q 'Phase 1' README.md